<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Smart Queue</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f6ff, #eef1ff);
            color: #20243a;
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .register-wrapper {
            width: 100%;
            max-width: 1000px;
            min-height: 620px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 70px rgba(55, 58, 130, 0.15);
        }

        /* LEFT */

        .register-left {
            background: linear-gradient(145deg, #615dea, #8068e9);
            padding: 55px;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 65px;
            font-size: 21px;
            font-weight: bold;
        }

        .logo-box {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: white;
            color: #615dea;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
        }

        .register-left h1 {
            font-size: 43px;
            line-height: 1.15;
            margin-bottom: 20px;
        }

        .register-left p {
            color: #e6e4ff;
            line-height: 1.8;
            font-size: 15px;
            max-width: 390px;
        }

        .back-home {
            display: inline-block;
            margin-top: 35px;
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        /* RIGHT */

        .register-right {
            padding: 50px 55px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .register-right h2 {
            font-size: 32px;
            margin-bottom: 8px;
            color: #242940;
        }

        .subtitle {
            color: #858a9d;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #3b4055;
            margin-bottom: 7px;
        }

        .form-group input {
            width: 100%;
            height: 47px;
            border: 1px solid #dfe1ed;
            border-radius: 10px;
            padding: 0 14px;
            font-size: 14px;
            outline: none;
            color: #292d43;
            background: #fafaff;
        }

        .form-group input:focus {
            border-color: #615dea;
            background: white;
            box-shadow: 0 0 0 3px rgba(97, 93, 234, 0.1);
        }

        .register-button {
            width: 100%;
            height: 51px;
            border: none;
            border-radius: 10px;
            background: #615dea;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .register-button:hover {
            background: #4e4bd0;
        }

        .register-button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .message {
            margin-top: 14px;
            text-align: center;
            font-size: 13px;
            min-height: 20px;
        }

        .success {
            color: #15966a;
        }

        .error {
            color: #dc4b5b;
        }

        .login-text {
            text-align: center;
            margin-top: 22px;
            color: #858a9d;
            font-size: 13px;
        }

        .login-text a {
            color: #615dea;
            font-weight: bold;
        }

        @media (max-width: 750px) {

            .register-wrapper {
                grid-template-columns: 1fr;
            }

            .register-left {
                padding: 40px;
            }

            .register-left .logo {
                margin-bottom: 35px;
            }

            .register-left h1 {
                font-size: 34px;
            }

            .register-right {
                padding: 40px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="register-wrapper">

        <!-- LEFT -->

        <div class="register-left">

            <div class="logo">
                <div class="logo-box">SQ</div>
                <span>Smart Queue</span>
            </div>

            <h1>
                Join Smart<br>
                Queue.
            </h1>

            <p>
                Create your account and get access to digital
                queue tokens, live queue tracking and faster
                service management.
            </p>

            <a href="index.html" class="back-home">
                ← Back to Home
            </a>

        </div>


        <!-- RIGHT -->

        <div class="register-right">

            <h2>Create Account</h2>

            <p class="subtitle">
                Fill in your details to create your account.
            </p>

            <form id="registerForm">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="6"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="register-button"
                    id="registerButton"
                >
                    Create Account
                </button>

            </form>


            <div id="registerMessage" class="message"></div>


            <div class="login-text">

                Already have an account?

                <a href="login.html">
                    Sign In
                </a>

            </div>

        </div>

    </div>

</div>


<script>

const API_URL = "http://localhost:5000";

const registerForm =
    document.getElementById("registerForm");

registerForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const name =
        document.getElementById("name").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const button =
        document.getElementById("registerButton");

    const message =
        document.getElementById("registerMessage");


    if (password !== confirmPassword) {

        message.textContent =
            "Passwords do not match.";

        message.className =
            "message error";

        return;
    }


    button.disabled = true;
    button.textContent = "Creating Account...";

    message.textContent = "";
    message.className = "message";


    try {

        const response = await fetch(
            `${API_URL}/api/auth/register`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    name: name,
                    email: email,
                    password: password
                })
            }
        );


        const data = await response.json();


        if (!response.ok || !data.success) {

            throw new Error(
                data.message || "Registration failed"
            );

        }


        message.textContent =
            "Account created successfully!";

        message.className =
            "message success";


        registerForm.reset();


        setTimeout(function() {

            window.location.href =
                "login.html";

        }, 1000);


    } catch (error) {

        message.textContent =
            error.message;

        message.className =
            "message error";

        button.disabled = false;

        button.textContent =
            "Create Account";
    }

});

</script>

</body>
</html>
